services:
  - type: web
    name: ai-trading-bot-free
    runtime: python
    plan: free
    branch: paper-trading-integration
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - main:app
    healthCheckPath: /health
    envVars:
      - key: PAPER_API_TOKEN
        generateValue: true
      - key: PAPER_DB_PATH
        value: /tmp/paper_trading.sqlite3
      - key: PAPER_ALLOW_EPHEMERAL_DB
        value: "true"
      - key: PAPER_STARTING_BALANCE
        value: "100"
      - key: PAPER_CURRENCY
        value: EUR
